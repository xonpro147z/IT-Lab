# Tự động đóng gói TinHocLab cho Windows (.exe), macOS (.dmg) và Linux (.deb)
# Chạy khi đẩy tag dạng v1.0.0, hoặc bấm "Run workflow" trong thẻ Actions.
name: Build TinHocLab

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
          - os: macos-latest
            cmd: npm run dist:mac
          - os: ubuntu-latest
            cmd: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Đóng gói
        run: ${{ matrix.cmd }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: TinHocLab-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: ignore
      - name: Đính kèm vào Release (khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage

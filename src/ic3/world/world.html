<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob: file: http:; media-src 'self' data: blob: file: http:; worker-src 'self' blob:">
<title>Đảo IC3 – TinHocLab</title>
<link rel="stylesheet" href="../../common.css">
<link rel="stylesheet" href="../ic3.css">
<link rel="stylesheet" href="world.css">
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js" } }</script>
</head>
<body class="world">
<canvas id="cv"></canvas>
<div id="labels"></div>

<!-- HUD -->
<div class="hud hud-me" id="hudMe" hidden></div>
<div class="hud hud-quest" id="hudQuest" hidden></div>
<div class="hud hud-top" id="hudTop" hidden>
  <span class="chip" id="hudNet" title="Kết nối máy giáo viên"></span>
  <button class="rb" id="bHelp" title="Hướng dẫn (H)">?</button>
  <button class="rb" data-nav="../teacher.html" title="Khu vực giáo viên (cần mật khẩu)">🔒</button>
  <button class="rb" id="bSound" title="Âm thanh">🔊</button>
</div>
<div class="hud hud-map" id="hudMap" hidden><canvas id="mini" width="180" height="180"></canvas><b>ĐẢO IC3</b></div>
<div class="hud hud-skills" id="hudSkills" hidden>
  <button data-go="closet"><i>👕</i><span>Tủ đồ</span><kbd>T</kbd></button>
  <button data-go="study"><i>📚</i><span>Ôn luyện</span><kbd>O</kbd></button>
  <button data-go="arena"><i>⚔️</i><span>Đấu trường</span><kbd>B</kbd></button>
  <button data-go="board"><i>🏆</i><span>Bảng vàng</span><kbd>L</kbd></button>
</div>
<div class="hud hud-home" id="hudHome" hidden><button data-nav="../../index.html">🏠 TinHocLab</button></div>
<div class="prompt" id="prompt" hidden></div>
<div class="bubble" id="bubble" hidden></div>

<!-- lớp phủ -->
<div class="ov" id="ovLogin" hidden></div>
<div class="ov" id="ovCloset" hidden></div>
<div class="ov ovStudy" id="ovStudy" hidden><iframe id="studyFrame" title="Ôn luyện IC3"></iframe></div>
<div class="ov" id="ovModal" hidden></div>
<div id="arenaUI" hidden></div>
<div id="loading"><div class="ld"><b>Đảo IC3</b><span>Đang dựng đảo…</span><i></i></div></div>
<div id="toast"></div>

<script src="../../common.js"></script>
<script src="../../ui/motion.js"></script>
<script type="module" src="world.js"></script>
</body>
</html>

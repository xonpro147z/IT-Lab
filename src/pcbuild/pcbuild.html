<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:">
<title>Lắp ráp máy tính 3D – TinHocLab</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="pcbuild.css">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="top">
  <button class="tb" onclick="location.href='../index.html'">← Trang chủ</button>
  <div class="title">🖥️ Lắp ráp máy tính 3D</div>
  <div class="seg" id="modeSeg">
    <button data-mode="free" class="on">Lắp tự do</button>
    <button data-mode="guided">Hướng dẫn từng bước</button>
  </div>
  <button class="tb" id="btnChallenge">🏆 Thử thách</button>
  <div class="spacer"></div>
  <button class="tb" id="btnView">🎥 Góc nhìn</button>
  <button class="tb" id="btnReset">↺ Làm lại</button>
</div>
<div id="layout">
  <aside id="left">
    <div id="cats"></div>
    <div id="catInfo"></div>
    <div id="parts"></div>
  </aside>
  <div id="view">
    <canvas id="c3d"></canvas>
    <div id="guide" hidden></div>
    <div id="challengeBox" hidden></div>
    <div id="hint">🖱️ Kéo chuột trái để xoay · Chuột phải để di chuyển · Cuộn để phóng to · Chuột phải vào linh kiện để tháo</div>
    <div id="tooltip" hidden></div>
    <div id="ctxMenu" hidden></div>
    <div id="detail" hidden></div>
    <div id="monitor" hidden><div class="bezel"><div class="screen" id="screen"></div><div class="mlabel">MONITOR</div></div><button class="btn" id="btnCloseMon">Đóng màn hình</button></div>
  </div>
  <aside id="right">
    <h3>Cấu hình của bạn</h3>
    <div id="buildList"></div>
    <div class="sum">
      <div><span>Tổng chi phí</span><b id="total">0đ</b></div>
      <div><span>Điện năng ước tính</span><b id="power">0 W</b></div>
      <div class="pbar"><span id="pbar"></span></div>
    </div>
    <h4>Kiểm tra tương thích</h4>
    <div id="checks"></div>
    <button id="btnPower">⚡ Bật nguồn</button>
  </aside>
</div>
<script src="../common.js"></script>
<script type="module" src="pcbuild.js"></script>
</body>
</html>
